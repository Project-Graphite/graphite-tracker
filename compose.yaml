name: graphite-tracker

services:
  server:
    build:
      context: ./app
      target: development
    command: [sh, -c, 'npm run prisma:migrate:deploy && exec npm run dev']
    environment:
      DATABASE_URL: postgresql://graphite:graphite@postgres:5432/graphite_tracker
      REDIS_URL: redis://redis:6379
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-local-access-token-secret-change-me}
      AUTH_TRUSTED_ORIGINS: http://localhost:4004,http://localhost:4002
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      GAME_SOURCE: ${GAME_SOURCE:-igdb}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      DISABLED_SOURCES: ${DISABLED_SOURCES:-}
      APP_URL: http://localhost:4004
      EMAIL_HOST: mailpit
      EMAIL_PORT: '1025'
      DEFAULT_FROM_EMAIL: Graphite Tracker <tracker@localhost>
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '4002:3000'
    volumes:
      - ./app:/app
      - /app/node_modules

  frontend:
    build:
      context: ./app
      target: development
    command: npm run dev --workspace frontend -- --host 0.0.0.0
    environment:
      VITE_API_ORIGIN: http://server:3000
    ports:
      - '4004:5173'
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - server

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '4025:8025'

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: graphite_tracker
      POSTGRES_USER: graphite
      POSTGRES_PASSWORD: graphite
    healthcheck:
      test: [CMD-SHELL, pg_isready -U graphite -d graphite_tracker]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10-alpine
    command: [redis-server, --save, '60', '1']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
