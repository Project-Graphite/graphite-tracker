name: graphite-tracker

services:
  web:
    build:
      context: ./app
      target: web
    environment:
      DATABASE_URL: postgresql://graphite:graphite@postgres:5432/graphite_tracker
      REDIS_URL: redis://redis:6379
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-local-access-token-secret-change-me}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET:-local-refresh-token-secret-change-me}
      AUTH_TRUSTED_ORIGINS: http://localhost:4004,http://localhost:4002
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4002:3000'

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: graphite_tracker
      POSTGRES_USER: graphite
      POSTGRES_PASSWORD: graphite
    healthcheck:
      test: [CMD-SHELL, pg_isready -U graphite -d graphite_tracker]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.2-alpine
    command: [redis-server, --save, '60', '1']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
