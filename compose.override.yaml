services:
  server:
    build:
      target: development
    command: [sh, -c, 'npm run prisma:migrate:deploy && exec npm run dev']
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      APP_URL: http://localhost:4004
      EMAIL_HOST: mailpit
      EMAIL_PORT: '1025'
      DEFAULT_FROM_EMAIL: Graphite Tracker <tracker@localhost>
    depends_on:
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./app
      target: development
    command: npm run dev --workspace frontend -- --host 0.0.0.0
    environment:
      VITE_API_ORIGIN: http://server:3000
    ports:
      - '4004:5173'
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - server

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '4025:8025'
