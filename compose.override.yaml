services:
  server:
    build:
      target: development
    command: [sh, -c, 'npm run prisma:migrate:deploy && exec npm run dev']
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      AUTH_EXPOSE_VERIFICATION_TOKEN: 'true'

  frontend:
    build:
      context: ./app
      target: development
    command: npm run dev --workspace frontend -- --host 0.0.0.0
    environment:
      VITE_API_ORIGIN: http://server:3000
    ports:
      - '4004:5173'
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - server
