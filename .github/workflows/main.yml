name: Main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  services:
    name: Detect
    uses: project-graphite/actions/.github/workflows/reusable-detect-services.yml@v1

  build:
    name: Build
    needs: services
    uses: project-graphite/actions/.github/workflows/reusable-docker-build-push.yml@v1
    with:
      services: ${{ needs.services.outputs.services }}

  deploy:
    name: Deploy
    needs: [services, build]
    uses: project-graphite/actions/.github/workflows/reusable-deploy.yml@v1
    with:
      services: ${{ needs.services.outputs.services }}
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
