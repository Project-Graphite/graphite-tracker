name: Main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  services:
    name: Detect
    uses: project-graphite/actions/.github/workflows/reusable-detect-services.yml@main

  checks:
    name: Checks
    needs: services
    uses: project-graphite/actions/.github/workflows/reusable-checks.yml@main
    with:
      services: ${{ needs.services.outputs.services }}

  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target web app

  secrets:
    name: Secrets
    uses: project-graphite/actions/.github/workflows/reusable-gitleaks.yml@main
