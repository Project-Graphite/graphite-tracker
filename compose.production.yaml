name: graphite-tracker

services:
  web:
    image: ghcr.io/project-graphite/graphite-tracker/app:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://graphite:${POSTGRES_PASSWORD:?}@postgres:5432/graphite_tracker
      REDIS_URL: redis://redis:6379
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?}
      AUTH_TRUSTED_ORIGINS: https://graphite-tracker.project-graphite.com
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      GAME_SOURCE: ${GAME_SOURCE:-igdb}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:3000/api/v1/health]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: graphite_tracker
      POSTGRES_USER: graphite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U graphite -d graphite_tracker]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  redis:
    image: redis:8.10-alpine
    command: [redis-server, --appendonly, 'yes']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M

volumes:
  postgres-data:
  redis-data:
